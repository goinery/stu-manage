server.port=8088

# 关闭缓存
spring.thymeleaf.cache= false
# 映射地址
spring.thymeleaf.prefix= classpath:/templates/

# MySQL (the development database supplied by doc/to-mysql.md)
spring.datasource.url = jdbc:mysql://localhost:3306/graduation_design?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&autoReconnect=true
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.username = root
spring.datasource.password = 123456

spring.resources.static-locations=classpath:/static,classpath:/public,classpath:/resources,classpath:/META-INF/resources

mybatis.mapper-locations=classpath:/mybatis/*.xml

logging.level.com.kzl.dao=debug


spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.write-dates-as-timestamps=false
